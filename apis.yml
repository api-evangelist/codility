name: Codility
description: >-
  Codility is a technical skills assessment and technical interview platform used by
  engineering and talent teams to screen, interview, and benchmark software developers.
  The platform provides real-world coding challenges (CodeCheck), an in-browser and
  VS Code-based technical interview environment (CodeLive), and Skills Intelligence for
  mapping and measuring engineering capabilities across an organization. Codility serves
  more than 20,000 engineering teams, is SOC 2 Type II and ISO 27001 certified, GDPR
  compliant, and hosts data in both US and EU regions. This API Evangelist profile
  captures the company's public developer, product, trust, and operational surface.
